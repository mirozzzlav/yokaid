server {
     server_name  $DOMAIN_TEST_PREFIX.$DOMAIN $DOMAIN;
     listen [::]:443 ssl ipv6only=on;
     listen 443 ssl;
     ssl_certificate /etc/certs/*.$DOMAIN/cert.pem;
     ssl_certificate_key /etc/certs/*.$DOMAIN/key.pem;

     location / {
         root   /usr/share/nginx/html;
         try_files $%uri $%uri/ /index.html;
     }
     location /api {
         rewrite ^/api(/.*)$ $1 break;
         proxy_pass http://$API_DOCKER:8080;
         proxy_set_header Host $API_DOCKER;
         proxy_set_header X-Real-IP $%remote_addr;
         proxy_set_header X-Forwarded-For $%proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $%scheme;
     }
     location /adminer {
         rewrite ^/adminer(/.*)$ $1 break;
         proxy_pass http://$ADMINER_DOCKER:8080;
         proxy_set_header Host $ADMINER_DOCKER;
         proxy_set_header X-Real-IP $%remote_addr;
         proxy_set_header X-Forwarded-For $%proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $%scheme;
     }
}
